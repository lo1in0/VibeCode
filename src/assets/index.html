<head>

<style>
:root{--green:#648465;--green2:#e5ede3;--ink:#202820;--muted:#778078;--line:#e5e9e3;--bg:#f6f7f3;--white:#fff;--red:#da7169;--yellow:#efce63;--soft:#f1f3ef;--shadow:0 4px 20px #2935240a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:190px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:#eef1eb;padding:22px 14px;display:flex;flex-direction:column}.brand{font-size:27px;font-weight:750;letter-spacing:1px;padding:5px 13px 26px}.nav{display:grid;gap:5px}.nav button,.settings{border:0;background:transparent;text-align:left;border-radius:9px;padding:11px 13px;color:#38423a}.nav button:hover,.nav button.active{background:#dfe8db;color:#253a27}.settings{margin-top:auto}.main{max-width:1600px;width:100%;margin:auto;padding:28px 30px 48px}.top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}.top h1{font-size:28px;line-height:1.2;margin:0 0 5px}.date{color:var(--muted);font-size:13px}.view{display:none}.view.active{display:block}.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}.cols{display:grid;grid-template-columns:.9fr 1.25fr .95fr;gap:12px}.section-title{font-size:17px;font-weight:650;margin:0 0 12px}.row{display:flex;align-items:center;gap:10px;border-bottom:1px solid #eff1ed;padding:10px 1px}.row:last-child{border:0}.task-toggle{width:21px;height:21px;border:1.5px solid #adb6ad;border-radius:50%;background:white;flex:0 0 21px;color:white;line-height:18px;padding:0}.task-toggle.checked{background:var(--green);border-color:var(--green)}.row-text{flex:1;min-width:0}.row-text.done{text-decoration:line-through;color:#969d96}.small{font-size:12px;color:var(--muted)}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:8px 12px}.btn:hover{bord display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-dow{text-align:center;color:var(--muted);padding:7px;font-size:12px}.cal-day{height:76px;border:1px solid var(--line);border-radius:8px;background:white;padding:7px;display:flex;flex-direction:column;align-items:flex-start;color:var(--ink)}.cal-day:hover{border-color:#afc2aa}.cal-day.selected{background:#e8f0e4;border-color:#91ad8d}.cal-day.muted-day{color:#b8bdb8}.dots{align-self:center;display:flex;gap:3px;margin:auto auto 3px}.dot.plan-dot{width:6px;height:6px}.reminder{padding:11px 0;border-bottom:1px solid var(--line)}.reminder:last-of-type{border:0}.reminder-text{font-weight:600}.reminder-time{color:var(--muted);font-size:12px}.habit-stats{white-space:pre-line;color:#536054;font-size:13px}.empty{color:var(--muted);padding:8px 0}.modal{position:fixed;inset:0;display:none;place-items:center;background:#1c251d66;padding:20px;z-index:5}.modal.show{display:grid}.dialog{background:white;border-radius:14px;padding:22px;width:min(580px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #17201733}.dialog h2{font-size:20px;margin:0 0 14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-item{display:grid;gap:4px}.form-item.full{grid-column:1/-1}.form-item label{font-size:12px;color:var(--muted)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.weekday-row{display:flex;gap:9px;flex-wrap:wrap}.weekday-row label{display:flex;align-items:center;gap:4px}.report-list{margin-top:12px}.kpi{background:var(--green2);border-radius:10px;padding:12px;margin:12px 0}.settings-list{line-height:2}.history-row{padding:9px 0;border-bottom:1px solid var(--line)}@media(max-width:1050px){.cols{grid-template-columns:1fr 1.3fr}.cols>:last-child{grid-column:1/-1}.cal-layout{grid-template-columns:1fr}}@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{position:sticky;z-index:2;height:auto;padding:8px 10px;top:0}.brand{display:none}.nav{display:flex;overflow:auto}.na </style><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="refinements.css"></head>
