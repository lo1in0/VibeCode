<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef2eb">
<title>JDI — Just Did It</title>
<style>
:root{--green:#648465;--green2:#e5ede3;--ink:#202820;--muted:#778078;--line:#e5e9e3;--bg:#f6f7f3;--white:#fff;--red:#da7169;--yellow:#efce63;--soft:#f1f3ef;--shadow:0 4px 20px #2935240a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:190px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:#eef1eb;padding:22px 14px;display:flex;flex-direction:column}.brand{font-size:27px;font-weight:750;letter-spacing:1px;padding:5px 13px 26px}.nav{display:grid;gap:5px}.nav button,.settings{border:0;background:transparent;text-align:left;border-radius:9px;padding:11px 13px;color:#38423a}.nav button:hover,.nav button.active{background:#dfe8db;color:#253a27}.settings{margin-top:auto}.main{max-width:1600px;width:100%;margin:auto;padding:28px 30px 48px}.top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}.top h1{font-size:28px;line-height:1.2;margin:0 0 5px}.date{color:var(--muted);font-size:13px}.view{display:none}.view.active{display:block}.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}.cols{display:grid;grid-template-columns:.9fr 1.25fr .95fr;gap:12px}.section-title{font-size:17px;font-weight:650;margin:0 0 12px}.row{display:flex;align-items:center;gap:10px;border-bottom:1px solid #eff1ed;padding:10px 1px}.row:last-child{border:0}.task-toggle{width:21px;height:21px;border:1.5px solid #adb6ad;border-radius:50%;background:white;flex:0 0 21px;color:white;line-height:18px;padding:0}.task-toggle.checked{background:var(--green);border-color:var(--green)}.row-text{flex:1;min-width:0}.row-text.done{text-decoration:line-through;color:#969d96}.small{font-size:12px;color:var(--muted)}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:8px 12px}.btn:hover{border-color:#b6c5b2}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.ghost{padding:4px 8px;color:var(--muted)}.addline{display:flex;gap:7px;margin-top:12px}.field{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:white;color:var(--ink)}.stack{display:grid;gap:12px}.plan{padding:9px 0;border-bottom:1px solid #eff1ed}.plan:last-child{border:0}.plan-date{color:var(--green);font-size:12px;font-weight:650}.completed{margin-top:14px}.completed summary{cursor:pointer;font-weight:650}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-head h2{font-size:20px;margin:0}.habit-card{margin-bottom:14px}.habit-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.habit-head h3{margin:0 0 3px;font-size:17px}.habit-meta{font-size:12px;color:var(--muted)}.habit-actions{display:flex;gap:6px;flex-wrap:wrap}.calendar-title{font-weight:650;margin:15px 0 8px}.habit-grid{display:grid;grid-template-columns:repeat(7,minmax(30px,1fr));gap:4px}.day-head{text-align:center;color:var(--muted);font-size:11px;padding:4px}.habit-day{border-radius:7px;background:#f0f2ee;text-align:center;padding:6px 2px;font-size:12px;min-height:30px}.habit-day.yes{background:#88bf83}.habit-day.partial{background:#f4d46d}.habit-day.miss{background:#e87870;color:#fff}.habit-day.future{opacity:.4}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);vertical-align:middle;margin-right:5px}.dot.red{background:var(--red)}.dot.yellow{background:var(--yellow)}.dot.blue{background:#758fcb}.dot.purple{background:#b46acd}.cal-layout{display:grid;grid-template-columns:minmax(420px,1.5fr) minmax(290px,.8fr);gap:14px}.month-head{display:flex;align-items:center;gap:7px;margin-bottom:10px}.month-head strong{font-size:19px;min-width:165px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-dow{text-align:center;color:var(--muted);padding:7px;font-size:12px}.cal-day{height:76px;border:1px solid var(--line);border-radius:8px;background:white;padding:7px;display:flex;flex-direction:column;align-items:flex-start;color:var(--ink)}.cal-day:hover{border-color:#afc2aa}.cal-day.selected{background:#e8f0e4;border-color:#91ad8d}.cal-day.muted-day{color:#b8bdb8}.dots{align-self:center;display:flex;gap:3px;margin:auto auto 3px}.dot.plan-dot{width:6px;height:6px}.reminder{padding:11px 0;border-bottom:1px solid var(--line)}.reminder:last-of-type{border:0}.reminder-text{font-weight:600}.reminder-time{color:var(--muted);font-size:12px}.habit-stats{white-space:pre-line;color:#536054;font-size:13px}.empty{color:var(--muted);padding:8px 0}.modal{position:fixed;inset:0;display:none;place-items:center;background:#1c251d66;padding:20px;z-index:5}.modal.show{display:grid}.dialog{background:white;border-radius:14px;padding:22px;width:min(580px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #17201733}.dialog h2{font-size:20px;margin:0 0 14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-item{display:grid;gap:4px}.form-item.full{grid-column:1/-1}.form-item label{font-size:12px;color:var(--muted)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.weekday-row{display:flex;gap:9px;flex-wrap:wrap}.weekday-row label{display:flex;align-items:center;gap:4px}.report-list{margin-top:12px}.kpi{background:var(--green2);border-radius:10px;padding:12px;margin:12px 0}.settings-list{line-height:2}.history-row{padding:9px 0;border-bottom:1px solid var(--line)}@media(max-width:1050px){.cols{grid-template-columns:1fr 1.3fr}.cols>:last-child{grid-column:1/-1}.cal-layout{grid-template-columns:1fr}}@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{position:sticky;z-index:2;height:auto;padding:8px 10px;top:0}.brand{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.settings{position:absolute;right:4px;top:4px;margin:0;padding:8px}.main{padding:18px 12px}.cols{grid-template-columns:1fr}.cols>:last-child{grid-column:auto}.cal-layout{grid-template-columns:minmax(0,1fr)}.cal-day{height:54px;padding:4px;font-size:11px}.month-head strong{min-width:0}.form-grid{grid-template-columns:1fr}.form-item.full{grid-column:auto}}
</style><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="refinements.css"></head>
<body><div class="app"><aside class="sidebar"><div class="brand">JDI<small>Just<br>Did It</small></div><nav class="nav"><button data-view="home" class="active">Главная</button><button data-view="tasks">Задачи</button><button data-view="habits">Привычки</button><button data-view="calendar">Календарь</button><button data-view="notes">Заметки</button></nav><button class="settings" id="settingsBtn" aria-label="Настройки" title="Настройки"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.7 2.2-2 .9-2.1-.7-2 3.4 1.5 1.6v2.3l-1.5 1.6 2 3.4 2.1-.7 2 .9.7 2.2h4l.7-2.2 2-.9 2.1.7 2-3.4-1.5-1.6v-2.3l1.5-1.6-2-3.4-2.1.7-2-.9-.7-2.2z"/><circle cx="11.5" cy="11.5" r="3.2"/></svg></button></aside>
<main class="main"><header class="top"><h1 id="pageTitle">Главная</h1><span class="date" id="todayLabel"></span></header>
<section id="home" class="view active"></section><section id="tasks" class="view"></section><section id="habits" class="view"></section><section id="calendar" class="view"></section><section id="notes" class="view"></section>
</main></div><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script>
(()=>{'use strict';
const STORE='jdi.data.v1', titles={home:'Главная',tasks:'Задачи',habits:'Привычки',calendar:'Календарь',notes:'Заметки'}, names=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'], dows=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
let db=load(), view='home', selected=dayKey(new Date()), month=new Date(new Date().getFullYear(),new Date().getMonth(),1), dialogReturn=null;
function load(){try{return JSON.parse(localStorage.getItem(STORE))||{tasks:[],habits:[],plans:[],reportSeen:''}}catch(e){return{tasks:[],habits:[],plans:[],reportSeen:''}}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){alert('Не удалось сохранить данные. Экспортируйте резервную копию в настройках.')}}
function id(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}
function dayKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDay(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function human(s,opts={day:'numeric',month:'short'}){return parseDay(s).toLocaleDateString('ru-RU',opts)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function due(h,d){let k=dayKey(d);return k>=h.start&&(!h.end||k<=h.end)&&(h.schedule!=='days'||h.days.includes((d.getDay()+6)%7))}
function active(h){return !h.closed&&(!h.end||h.end>=dayKey(new Date()))}
function progress(h,k){return Object.prototype.hasOwnProperty.call(h.logs,k)?h.logs[k]:null}
function mark(h,v){h.logs[dayKey(new Date())]=v;save();render()}
function btn(label,action,primary=false,extra='',attrs=''){return `<button class="btn ${primary?'primary':''} ${extra}" data-action="${action}" ${attrs}>${label}</button>`}
function empty(s){return `<div class="empty">${s}</div>`}
function taskRow(t,completed=false){return `<div class="row"><button class="task-toggle ${completed?'checked':''}" data-action="toggle-task" data-id="${esc(t.id)}">${completed?'✓':''}</button><span class="row-text ${completed?'done':''}">${esc(t.text)}</span>${btn('×','delete-task',false,'ghost',`data-id="${esc(t.id)}" aria-label="Удалить задачу"`)}</div>`}

function planList(){return db.plans.filter(p=>p.day>=dayKey(new Date())).sort((a,b)=>a.day.localeCompare(b.day)||(a.time||'').localeCompare(b.time||'')).slice(0,6).map(p=>`<div class="plan"><div class="plan-date">${human(p.day)}${p.time?' · '+esc(p.time):''}</div><div>${esc(p.text)}</div></div>`).join('')||empty('Ближайших планов нет')}
function habitToday(h){let v=progress(h,dayKey(new Date()));return `<div class="row"><button class="task-toggle ${v!==null&&v>0?'checked':''}" data-action="log-habit" data-id="${h.id}">${v!==null&&v>0?'✓':''}</button><span class="row-text"><b>${esc(h.name)}</b><br><span class="small">${v===null?'Нет отметки':h.binary?(v?'Да':'Нет'):`${v} ${esc(h.unit)}`}</span></span>${btn('Записать','log-habit',false,'',`data-id="${h.id}"`)}</div>`}
function renderHome(){let today=db.tasks.filter(t=>t.day===dayKey(new Date())),habits=db.habits.filter(h=>active(h)&&due(h,new Date()));return `<div class="cols"><div class="card"><h2 class="section-title">Привычки</h2>${habits.map(h=>habitToday(h)).join('')||empty('На сегодня привычек нет')}${btn('Все привычки','go-habits')}</div><div class="card"><h2 class="section-title">Задачи на сегодня</h2>${today.filter(t=>!t.done).map(t=>taskRow(t)).join('')||empty('Задач пока нет')}<div class="addline"><input class="field" id="quickTask" placeholder="Добавить задачу…">${btn('Добавить','add-task',true)}</div>${today.some(t=>t.done)?`<details class="completed"><summary>Выполненные (${today.filter(t=>t.done).length})</summary>${today.filter(t=>t.done).map(t=>taskRow(t,true)).join('')}</details>`:''}</div><div class="card"><h2 class="section-title">Ближайшие планы</h2>${planList()}${btn('Открыть календарь','go-calendar')}</div></div><div style="margin-top:14px">${btn('Сводка за прошлую неделю','report')}</div>`}
function renderTasks(){let today=db.tasks.filter(t=>t.day===dayKey(new Date()));let old=db.tasks.filter(t=>!t.done&&!t.handled&&t.day<dayKey(new Date()));return `<div class="card"><h2 class="section-title">Сегодня, ${human(dayKey(new Date()),{day:'numeric',month:'long'})}</h2><div class="addline"><input class="field" id="newTask" placeholder="Добавить задачу…">${btn('Добавить','add-task',true)}</div>${today.filter(t=>!t.done).map(t=>taskRow(t)).join('')||empty('Задач пока нет')}</div><details class="card completed" open><summary>Выполненные (${today.filter(t=>t.done).length})</summary>${today.filter(t=>t.done).map(t=>taskRow(t,true)).join('')||empty('Выполненных задач пока нет')}</details>${old.length?`<div class="card completed"><h2 class="section-title">Не выполнено в предыдущие дни</h2>${old.map(t=>`<div class="row"><span class="row-text">${esc(t.text)} <span class="small">· ${human(t.day)}</span></span>${btn('На сегодня','reassign-task')}<i hidden>${t.id}</i></div>`.replace('data-action="reassign-task"','data-action="reassign-task" data-id="'+t.id+'')).join('')}</div>`:''}<div class="card completed"><h2 class="section-title">История задач</h2>${db.tasks.filter(t=>t.day!==dayKey(new Date())).sort((a,b)=>b.day.localeCompare(a.day)).map(t=>`<div class="history-row"><span>${t.done?'✓':'○'} ${esc(t.text)}</span><span class="small"> · ${human(t.day,{day:'numeric',month:'short',year:'numeric'})}</span></div>`).join('')||empty('История пуста')}</div>`}
function habitMonth(h){let now=new Date(), first=new Date(now.getFullYear(),now.getMonth(),1), offset=(first.getDay()+6)%7, html=dows.map(x=>`<div class="day-head">${x}</div>`).join('');for(let i=0;i<offset;i++)html+='<div></div>';for(let n=1;n<=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();n++){let dt=new Date(first.getFullYear(),first.getMonth(),n),v=progress(h,dayKey(dt)),cls='habit-day';if(dt>now)cls+=' future';else if(v!==null)cls+=v>=(h.min||1)?' yes':v>0?' partial':' miss';else if(due(h,dt)&&dt<now)cls+=' miss';html+=`<div class="${cls}" title="${v===null?'Нет отметки':h.binary?(v?'Да':'Нет'):`${v} ${esc(h.unit)}`} ">${n}</div>`}return `<div class="calendar-title">${first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</div><div class="habit-grid">${html}</div><div class="legend"><span><i class="dot"></i>Выполнено</span><span><i class="dot yellow"></i>Частично</span><span><i class="dot red"></i>Ниже минимума</span><span>Серый — нет данных</span></div>`}
function stats(h,start,end){let target=[],s=parseDay(start),e=parseDay(end),today=new Date();for(let d=new Date(s);d<=e&&d<=today;d.setDate(d.getDate()+1))if(due(h,d))target.push(new Date(d));if(h.schedule==='weekly'){let buckets={};target.forEach(d=>{let week=new Date(d);week.setDate(week.getDate()-week.getDay());let k=dayKey(week);buckets[k]=(buckets[k]||0)+1});target=Object.keys(buckets).flatMap(k=>Array.from({length:Math.min(h.times,buckets[k])},()=>k))}let vals=target.map(d=>typeof d==='string'?progress(h,d):progress(h,dayKey(d))).filter(v=>v!==null),min=vals.filter(v=>v>=(h.min||1)).length,upper=vals.filter(v=>v>=(h.max||1)).length,over=vals.filter(v=>v>(h.max||1)).length,pct=target.length?Math.round(100*min/target.length):0;return `Выполнение: ${target.length?pct+'%':'—'} (${min}/${target.length}) · Ориентир: ${upper} · Перевыполнение: ${over}${h.binary?'':` · Сверх ориентира: ${vals.reduce((a,v)=>a+Math.max(0,v-h.max),0)} ${esc(h.unit)}`}`}
function renderHabit(h){return `<article class="card habit-card"><div class="habit-head"><div><h3>${esc(h.name)}</h3><div class="habit-meta">${h.binary?'Да / нет':`${h.min}–${h.max} ${esc(h.unit)}`} · ${h.schedule==='daily'?'Ежедневно':h.schedule==='weekly'?`${h.times} раз в неделю`:'По дням недели'}<br>${human(h.start,{day:'numeric',month:'short',year:'numeric'})} — ${h.end?human(h.end,{day:'numeric',month:'short',year:'numeric'}):'без окончания'}</div></div><div class="habit-actions">${due(h,new Date())?btn('Записать результат','log-habit',true):''}${btn('Статистика','habit-stat')}${btn('Завершить','close-habit')}</div></div>${habitMonth(h)}<div class="habit-stats">${stats(h,dayKey(new Date(new Date().getFullYear(),new Date().getMonth(),1)),dayKey(new Date()))}</div><i hidden>${h.id}</i></article>`}
function renderHabits(){let a=db.habits.filter(active),c=db.habits.filter(h=>!active(h));return `<div class="section-head"><h2>Активные привычки</h2>${btn('+ Новая привычка','new-habit',true)}</div>${a.map(renderHabit).join('')||empty('Добавьте первую привычку')}<details class="card completed"><summary>Завершённые (${c.length})</summary>${c.map(renderHabit).join('')||empty('Завершённых привычек пока нет')}</details>`}
function sameMonth(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()}
function renderCalendar(){let f=new Date(month.getFullYear(),month.getMonth(),1),offset=(f.getDay()+6)%7,html=dows.map(x=>`<div class="cal-dow">${x}</div>`).join('');for(let i=0;i<offset;i++)html+='<div></div>';let days=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();for(let n=1;n<=days;n++){let dt=new Date(f.getFullYear(),f.getMonth(),n),k=dayKey(dt),has=db.plans.some(p=>p.day===k);html+=`<button class="cal-day ${selected===k?'selected':''} ${k===dayKey(new Date())?'is-today':''}" aria-pressed="${selected===k}" ${k===dayKey(new Date())?'aria-current="date"':''} data-action="select-date" data-date="${k}"><span>${n}</span>${has?'<span class="dots"><i class="dot plan-dot"></i></span>':''}</button>`}let d=parseDay(selected),ps=db.plans.filter(p=>p.day===selected).sort((a,b)=>(a.time||'').localeCompare(b.time||''));return `<div class="cal-layout"><div class="card"><div class="month-head">${btn('‹','prev-month')}<strong>${f.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</strong>${btn('›','next-month')}${btn('Сегодня','today')}</div><div class="calendar-grid">${html}</div></div><div class="card"><h2 class="section-title">${d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</h2><div class="small">${names[d.getDay()]}</div>${ps.map(p=>`<div class="reminder"><div class="reminder-text">${esc(p.text)}</div><div class="reminder-time">${p.time?'◷ '+esc(p.time):'Весь день'}</div>${btn('Удалить','delete-plan',false,'ghost')}<i hidden>${p.id}</i></div>`).join('')||empty('На эту дату планов нет')}${btn('+ Добавить напоминание','new-plan',true)}<div class="small" style="margin-top:8px">Уведомление приходит в 08:00 накануне.</div></div></div>`}
function render(){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===view));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===view));document.getElementById('pageTitle').textContent=titles[view];document.getElementById('todayLabel').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById(view).innerHTML=view==='home'?renderHome():view==='tasks'?renderTasks():view==='habits'?renderHabits():renderCalendar()}
function openModal(title,fields,submit){let dlg=document.getElementById('dialog');dlg.innerHTML=`<h2>${title}</h2><div class="form-grid">${fields}</div><div class="dialog-actions"><button class="btn" data-action="close-modal">Отмена</button><button class="btn primary" id="saveDialog">Сохранить</button></div>`;document.getElementById('modal').classList.add('show');document.getElementById('saveDialog').onclick=()=>{let result=submit(dlg);if(result!==false){closeModal();save();render()}}}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function input(label,id,type='text',value='',extra=''){return `<div class="form-item"><label for="${id}">${label}</label><input class="field" id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function select(label,id,opts){return `<div class="form-item"><label for="${id}">${label}</label><select class="field" id="${id}">${opts.map((x,i)=>`<option value="${x[0]}" ${i===0?'selected':''}>${x[1]}</option>`).join('')}</select></div>`}
function newHabit(){openModal('Новая привычка',`${input('Название','hName')}${select('Результат','hType',[['number','Количество'],['binary','Да / нет']])}${input('Минимум для зачёта','hMin','number','15','min="0.01" step="any"')}${input('Верхний ориентир','hMax','number','30','min="0.01" step="any"')}${input('Единица измерения','hUnit','text','мин')}${select('Периодичность','hSchedule',[['daily','Ежедневно'],['days','По дням недели'],['weekly','Раз в неделю']])}<div class="form-item full" id="weekdays" hidden><label>Дни</label><div class="weekday-row">${dows.map((x,i)=>`<label><input type="checkbox" value="${i}" checked>${x}</label>`).join('')}</div></div>${input('Раз в неделю, количество (1–7)','hTimes','number','3','min="1" max="7"')}${input('Начало','hStart','date',dayKey(new Date()))}${input('Окончание','hEnd','date',dayKey(new Date(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate())))}<div class="form-item full"><label><input type="checkbox" id="hOpen"> Без даты окончания</label></div>` ,dlg=>{let g=id=>dlg.querySelector('#'+id),name=g('hName').value.trim(),binary=g('hType').value==='binary',min=Number(g('hMin').value),max=Number(g('hMax').value),schedule=g('hSchedule').value,start=g('hStart').value,end=g('hEnd').value,open=g('hOpen').checked,times=Number(g('hTimes').value),days=[...dlg.querySelectorAll('#weekdays input:checked')].map(x=>Number(x.value));if(!name||!start||(!open&&(!end||end<start))||(!binary&&(!min||max<min||!g('hUnit').value.trim()))||(schedule==='days'&&!days.length)||(schedule==='weekly'&&(!times||times>7))){alert('Проверьте название, диапазон цели, расписание и даты.');return false}db.habits.push({id:id(),name,binary,min,max,unit:g('hUnit').value.trim(),schedule,days,times,start,end:open?'':end,closed:false,logs:{}})})}
function editPlan(){openModal('Новое напоминание',`${input('План','pText')}${input('Время (необязательно)','pTime','time')}`,dlg=>{let text=dlg.querySelector('#pText').value.trim(),time=dlg.querySelector('#pTime').value;if(!text){alert('Введите текст напоминания.');return false}db.plans.push({id:id(),text,time,day:selected,notified:false})})}
function report(){let end=new Date(),dow=end.getDay();end.setDate(end.getDate()-dow-1);let start=new Date(end);start.setDate(start.getDate()-6);let a=dayKey(start),b=dayKey(end),tasks=db.tasks.filter(t=>t.done&&t.day>=a&&t.day<=b).length;openModal('Еженедельная сводка',`<div class="form-item full"><b>${human(a,{day:'numeric',month:'short'})} — ${human(b,{day:'numeric',month:'short',year:'numeric'})}</b><div class="kpi">Выполнено задач: ${tasks}</div>${db.habits.filter(h=>h.start<=b&&(!h.end||h.end>=a)).map(h=>`<div class="report-list"><b>${esc(h.name)}</b><br><span class="small">${stats(h,a,b)}</span></div>`).join('')||'<span class="small">Привычек за эту неделю нет</span>'}</div>`,()=>{})}
function route(action,el){let obj,task;switch(action){case'go-habits':go('habits');break;case'go-calendar':go('calendar');break;case'add-task':{let inp=document.getElementById(view==='home'?'quickTask':'newTask');let text=inp?.value.trim();if(text){db.tasks.push({id:id(),text,day:dayKey(new Date()),done:false,handled:false});save();render();document.getElementById(view==='home'?'quickTask':'newTask')?.focus()}break}case'toggle-task':task=db.tasks.find(t=>t.id===el.dataset.id);if(task){task.done=!task.done;save();render()}break;case'delete-task':task=db.tasks.find(t=>t.id===el.dataset.id);if(task&&confirm('Удалить задачу?')){db.tasks=db.tasks.filter(t=>t!==task);save();render()}break;case'reassign-task':task=db.tasks.find(t=>t.id===el.dataset.id);if(task){db.tasks.push({id:id(),text:task.text,day:dayKey(new Date()),done:false,handled:false});task.handled=true;save();render()}break;case'log-habit':obj=db.habits.find(h=>h.id===el.dataset.id);if(obj)logHabit(obj);break;case'new-habit':newHabit();break;case'close-habit':obj=db.habits.find(h=>h.id===el.closest('.habit-card')?.querySelector('i')?.textContent.trim());if(obj&&confirm('Завершить привычку? История сохранится.')){obj.closed=true;obj.end=dayKey(new Date());save();render()}break;case'habit-stat':obj=db.habits.find(h=>h.id===el.closest('.habit-card')?.querySelector('i')?.textContent.trim());if(obj)openModal('История и статистика',`<div class="form-item full">${habitMonth(obj)}<p>${stats(obj,dayKey(new Date(new Date().getFullYear(),new Date().getMonth(),1)),dayKey(new Date()))}</p></div>`,()=>{});break;case'new-plan':editPlan();break;case'delete-plan':{let idp=el.parentElement.querySelector('i')?.textContent.trim();if(confirm('Удалить напоминание?')){db.plans=db.plans.filter(p=>p.id!==idp);save();render()}break}case'select-date':selected=el.dataset.date;render();break;case'prev-month':month=new Date(month.getFullYear(),month.getMonth()-1,1);render();break;case'next-month':month=new Date(month.getFullYear(),month.getMonth()+1,1);render();break;case'today':selected=dayKey(new Date());month=new Date(new Date().getFullYear(),new Date().getMonth(),1);render();break;case'report':report();break;case'close-modal':closeModal();break;case'settings':settings();break;case'export':exportData();break}}
function go(v){view=v;render()}
function logHabit(h){let prior=progress(h,dayKey(new Date()));openModal('Результат · '+esc(h.name),h.binary?select('Выполнено сегодня?','binaryResult',[['1','Да'],['0','Нет']]):input('Сколько '+esc(h.unit)+'?','result','number',prior??'','min="0" step="any"'),dlg=>{let field=dlg.querySelector(h.binary?'#binaryResult':'#result');if(field.value===''){alert('Введите результат');return false}let v=Number(field.value);if(!Number.isFinite(v)||v<0){alert('Введите число от нуля');return false}h.logs[dayKey(new Date())]=v})}
function settings(){openModal('Настройки JDI',`<div class="form-item full settings-list"><b>Локальные данные</b><br>Хранятся в этом профиле браузера.<br><b>Напоминания</b><br>Уведомление планируется на 08:00 накануне. Страница должна быть открыта, чтобы браузер его показал.<br><b>Сводка недели</b><br>Воскресенье — суббота.<br>${btn('Экспорт JSON','export')}${'Notification' in window&&Notification.permission==='default'?btn('Разрешить уведомления','notification-permission'):''}</div>`,()=>{})}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='JDI-backup-'+dayKey(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function reminderTick(){let now=new Date();for(let p of db.plans){let notifyAt=new Date(parseDay(p.day).getFullYear(),parseDay(p.day).getMonth(),parseDay(p.day).getDate()-1,8,0);if(!p.notified&&now>=notifyAt&&p.day>=dayKey(now)){p.notified=true;save();if('Notification'in window&&Notification.permission==='granted')new Notification('JDI · План на завтра',{body:p.text});else if(document.visibilityState==='visible')console.info('JDI · План на завтра: '+p.text)}}let end=new Date(now);end.setDate(end.getDate()-end.getDay()-1);if(now.getDay()===0&&now.getHours()>=8&&db.reportSeen!==dayKey(end)){db.reportSeen=dayKey(end);save();if('Notification'in window&&Notification.permission==='granted')new Notification('JDI · Сводка готова',{body:'Откройте JDI, чтобы посмотреть итоги недели.'})}}
document.querySelector('.nav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b)go(b.dataset.view)});
document.body.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)route(b.dataset.action,b);if(e.target.closest('#settingsBtn'))settings()});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='quickTask'||e.target.id==='newTask'))route('add-task',e.target)});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('dialog').addEventListener('change',e=>{if(e.target.id==='hType'){let on=e.target.value==='number';['hMin','hMax','hUnit'].forEach(k=>document.getElementById(k).closest('.form-item').hidden=!on)}if(e.target.id==='hSchedule'){document.getElementById('weekdays').hidden=e.target.value!=='days';document.getElementById('hTimes').closest('.form-item').hidden=e.target.value!=='weekly'}});
function init(){render();setInterval(reminderTick,30000);reminderTick();if('Notification'in window&&Notification.permission==='default'){let b=document.createElement('button');b.className='btn';b.id='notificationPermission';b.hidden=true;b.textContent='Разрешить уведомления JDI';b.onclick=async()=>{await Notification.requestPermission();b.remove()};document.body.appendChild(b)}}
db.notes ||= [];
let selectedNote=db.notes[0]?.id;
const oldRoute=route,oldRender=render,oldCalendar=renderCalendar,oldOpen=openModal;
function plus(action,label,attrs=''){return `<button class="plus" data-action="${action}" aria-label="${label}" title="${label}" ${attrs}>+</button>`}
function folder(title,body,cls=''){return `<article class="card ${cls}"><h2 class="section-title">${title}</h2>${body}</article>`}
function noteSummary(n){return n?`<button class="text-button" data-action="open-note" data-id="${n.id}"><h3>${esc(n.title)}</h3><p>${esc(n.body.slice(0,130))}${n.body.length>130?'…':''}</p><span class="small">${new Date(n.updated).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</span></button>`:empty('Сохраните идею, чтобы вернуться к ней позже')}
planList=function(){return db.plans.filter(p=>p.day>=dayKey(new Date())).sort((a,b)=>a.day.localeCompare(b.day)||(a.time||'').localeCompare(b.time||'')).slice(0,6).map(p=>`<div class="plan"><div class="date-badge"><b>${parseDay(p.day).getDate()}</b><span>${human(p.day,{month:'short'})}</span></div><div><b>${esc(p.text)}</b><div class="small">${p.time?esc(p.time)+' · ':''}${human(p.day,{weekday:'long'})}</div></div></div>`).join('')||empty('Добавьте первый план в календарь')};
habitToday=function(h){let v=progress(h,dayKey(new Date())),done=v!==null&&v>=(h.min||1),percent=h.binary?(v?100:0):Math.min(100,100*(v||0)/(h.min||1));return `<div class="row"><button class="task-toggle ${done?'checked':''}" aria-label="Записать результат: ${esc(h.name)}" data-action="log-habit" data-id="${h.id}">${done?'✓':''}</button><div class="row-text"><b>${esc(h.name)}</b><div class="small">${v===null?'Сегодня · нет отметки':h.binary?(v?'Выполнено':'Не выполнено'):`${done?'Выполнено':'Частично'} · ${v} ${esc(h.unit)}`}</div>${v>0&&!done?`<div class="progress-track"><span style="width:${percent}%"></span></div>`:''}</div></div>`};
renderHome=function(){const tasks=db.tasks.filter(t=>t.day===dayKey(new Date())).sort((a,b)=>Number(a.done)-Number(b.done)),habits=db.habits.filter(h=>active(h)&&due(h,new Date()));return `<div class="cols">${folder('Привычки',habits.map(habitToday).join('')||empty('Добавьте первую привычку')) .replace('</article>',plus('new-habit','Добавить привычку')+'</article>')}${folder('Задачи',(tasks.map(t=>taskRow(t,t.done)).join('')||empty('Что вы хотите сделать сегодня?'))+plus('create-task','Добавить задачу'))}${folder('Планы',planList()+plus('create-plan','Добавить план'))}</div>${folder('Заметки',`<div class="note-preview">${noteSummary([...db.notes].sort((a,b)=>b.updated.localeCompare(a.updated))[0])}${plus('new-note','Создать заметку')}</div>`,'home-notes')}`};
renderTasks=function(){const today=dayKey(new Date()),pending=db.tasks.filter(t=>!t.done&&t.day===today),done=db.tasks.filter(t=>t.done),old=db.tasks.filter(t=>!t.done&&!t.handled&&t.day<today);return `<div class="cols task-board">${folder('Сегодня',(pending.map(t=>taskRow(t)).join('')||empty('Все задачи на сегодня выполнены'))+plus('create-task','Добавить задачу'))}${folder('Выполненные',done.map(t=>taskRow(t,true)).join('')||empty('Здесь появятся выполненные задачи'))}${folder('Просроченные',old.map(t=>`<div class="row"><div class="row-text">${esc(t.text)}<div class="small overdue">Был срок: ${human(t.day)}</div></div>${btn('На сегодня','reassign-task',false,'',`data-id="${t.id}"`)}</div>`).join('')||empty('Просроченных задач нет'))}</div>`};
function weekData(h){let days=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);if(due(h,d))days.push(dayKey(d))}let done=days.filter(k=>(progress(h,k)||0)>=(h.min||1)).length;return {done,total:days.length,pct:days.length?Math.round(100*done/days.length):0}}
renderHabits=function(){let habits=db.habits.filter(active),done=habits.filter(h=>(progress(h,dayKey(new Date()))||0)>=(h.min||1)).length,avg=habits.length?Math.round(habits.reduce((s,h)=>s+weekData(h).pct,0)/habits.length):0;let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return dayKey(d)});return `<div class="two-cols">${folder('Мои привычки',(habits.map(h=>habitToday(h)+`<div class="small" style="text-align:right;margin-bottom:9px">${btn('История','show-habit',false,'ghost',`data-id="${h.id}"`)}</div>`).join('')||empty('Начните с одной небольшой привычки'))+plus('new-habit','Добавить привычку'))}${folder('Статистика',`<div class="kpis"><div class="kpi"><b>${habits.length}</b>Активных привычек</div><div class="kpi"><b>${done}</b>Выполнено сегодня</div><div class="kpi"><b>${avg}%</b>За последние 7 дней</div></div><b>Прогресс привычек</b>${habits.map(h=>`<div class="progress-row"><span>${esc(h.name)}</span><div class="progress-track"><span style="width:${weekData(h).pct}%"></span></div><span class="small">${weekData(h).pct}%</span></div>`).join('')}`)}</div>${folder('Календарь привычек',`<div class="habit-table"><table><thead><tr><th>Последние 7 дней</th>${days.map(k=>`<th>${human(k,{weekday:'short'})}<br>${human(k)}</th>`).join('')}</tr></thead><tbody>${habits.map(h=>`<tr><th>${esc(h.name)}</th>${days.map(k=>{let v=progress(h,k);return `<td><span title="${v===null?'Нет отметки':v+' '+esc(h.unit||'')}" class="history-dot ${v>=(h.min||1)?'yes':v>0?'partial':''}"></span></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`,'bottom-card')}<details class="card completed"><summary>Завершённые привычки</summary>${db.habits.filter(h=>!active(h)).map(renderHabit).join('')||empty('Пока нет завершённых привычек')}</details>`};
renderCalendar=function(){return oldCalendar().replace('class="card"><div class="month-head"','class="card calendar-card"><div class="month-head"')+folder('Ближайшие напоминания',planList(),'bottom-card')};
function noteRow(n){return `<div class="note-row"><button class="note-symbol" data-action="favorite-note" data-id="${n.id}" aria-label="${n.favorite?'Убрать из избранного':'В избранное'}">${n.favorite?'★':'☆'}</button><button class="text-button" data-action="open-note" data-id="${n.id}"><b>${esc(n.title)}</b><span class="small">${esc(n.body.slice(0,80))}</span></button><time>${new Date(n.updated).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</time></div>`}
function renderNotes(){let recent=[...db.notes].sort((a,b)=>b.updated.localeCompare(a.updated)),n=db.notes.find(n=>n.id===selectedNote);return `<div class="two-cols">${folder('Последние заметки',(recent.map(noteRow).join('')||empty('Идеи, мысли и важные записи'))+plus('new-note','Создать заметку'))}${folder('Избранное',(recent.filter(n=>n.favorite).map(noteRow).join('')||empty('Нажмите на звезду рядом с заметкой'))+plus('new-favorite','Создать избранную заметку'))}</div>${folder('Открытая заметка',n?`<h3 style="margin:0 0 10px">${esc(n.title)}</h3><div class="note-body">${esc(n.body)}</div><div class="note-tools">${btn('Редактировать','edit-note',true,'',`data-id="${n.id}"`)}${btn('Удалить','delete-note',false,'',`data-id="${n.id}"`)}</div>`:empty('Выберите заметку в списке'),'bottom-card')}`}
render=function(){oldRender();if(view==='notes')document.getElementById('notes').innerHTML=renderNotes();const now=new Date();document.getElementById('todayLabel').textContent=now.toLocaleDateString('ru-RU',{weekday:'short'}).toUpperCase()+'　|　'+now.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});document.querySelectorAll('[data-action="toggle-task"]').forEach(b=>{b.setAttribute('aria-label','Изменить статус задачи');b.setAttribute('aria-pressed',b.classList.contains('checked'))})};
function editNote(n,favorite=false){openModal(n?'Редактировать заметку':'Новая заметка',input('Заголовок','noteTitle','text',n?.title||'')+`<div class="form-item full"><label for="noteBody">Текст</label><textarea id="noteBody" class="field">${esc(n?.body||'')}</textarea></div>`,dlg=>{let title=dlg.querySelector('#noteTitle').value.trim(),body=dlg.querySelector('#noteBody').value;if(!title){alert('Введите заголовок');return false}if(n){n.title=title;n.body=body;n.updated=new Date().toISOString()}else{n={id:id(),title,body,favorite,updated:new Date().toISOString()};db.notes.push(n)}selectedNote=n.id})}
route=function(action,el){let n=db.notes.find(n=>n.id===el.dataset.id);switch(action){case'notification-permission':document.getElementById('notificationPermission')?.click();break;case'create-task':openModal('Новая задача',input('Что нужно сделать?','taskText'),dlg=>{let text=dlg.querySelector('#taskText').value.trim();if(!text){alert('Введите задачу');return false}db.tasks.push({id:id(),text,day:dayKey(new Date()),done:false,handled:false})});break;case'create-plan':openModal('Новый план',input('Название','planText')+input('Дата','planDate','date',dayKey(new Date()))+input('Время','planTime','time'),dlg=>{let text=dlg.querySelector('#planText').value.trim(),day=dlg.querySelector('#planDate').value;if(!text||!day){alert('Укажите название и дату');return false}db.plans.push({id:id(),text,day,time:dlg.querySelector('#planTime').value,notified:false})});break;case'new-note':editNote();break;case'new-favorite':editNote(null,true);break;case'open-note':selectedNote=el.dataset.id;go('notes');break;case'edit-note':if(n)editNote(n);break;case'favorite-note':if(n){n.favorite=!n.favorite;save();render()}break;case'delete-note':if(n&&confirm('Удалить заметку «'+n.title+'»?')){db.notes=db.notes.filter(x=>x!==n);selectedNote=db.notes[0]?.id;save();render()}break;case'show-habit':{let h=db.habits.find(h=>h.id===el.dataset.id);if(h)openModal(esc(h.name),`<div class="form-item full">${habitMonth(h)}<button class="btn" data-action="finish-habit" data-id="${h.id}">Завершить привычку</button></div>`,()=>{});break}case'finish-habit':{let h=db.habits.find(h=>h.id===el.dataset.id);if(h&&confirm('Завершить привычку? История сохранится.')){h.closed=true;h.end=dayKey(new Date());save();closeModal();render()}break}default:oldRoute(action,el)}};
openModal=function(title,fields,submit){dialogReturn=document.activeElement;oldOpen(title,fields,submit);const dlg=document.getElementById('dialog');dlg.setAttribute('role','dialog');dlg.setAttribute('aria-modal','true');dlg.setAttribute('aria-label',title);dlg.querySelectorAll('.form-item').forEach(item=>{let field=item.querySelector('input,select,textarea'),label=item.querySelector('label');if(field&&label)label.htmlFor=field.id});dlg.querySelector('input,textarea,select,button')?.focus();dlg.querySelectorAll('#hType,#hSchedule').forEach(x=>x.dispatchEvent(new Event('change',{bubbles:true})))};
const priorClose=closeModal;
closeModal=function(){priorClose();dialogReturn?.focus()};
document.addEventListener('keydown',e=>{if(!document.getElementById('modal').classList.contains('show'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){let items=[...document.getElementById('dialog').querySelectorAll('button,input,textarea,select')].filter(x=>!x.closest('[hidden]'));let first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

const layoutRender=render;
render=function(){layoutRender();document.querySelectorAll('.view.active .card:not(details)').forEach(card=>{if(card.querySelector(':scope > .folder-content'))return;const content=document.createElement('div');content.className='folder-content';[...card.children].forEach(child=>{if(!child.classList.contains('section-title'))content.appendChild(child)});card.appendChild(content)})};
init();
})();
</script></body></html>
